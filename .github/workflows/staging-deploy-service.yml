name: Staging deploy and smoke tests (service Postgres)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=2s --health-retries=10
    env:
      AURORA_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      AURORA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      AURORA_PHASE36_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      AURORA_PHASE37_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Debug runner info
        run: |
          echo "Runner uname:"; uname -a || hostname
          echo "Environment sample:"; env | sort | sed -n '1,200p'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system deps (psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r aurora-live/requirements.txt

      - name: Run migration script (migrate_sqlite_to_postgres)
        run: |
          # Create a small sqlite fixture and run the migration into staging DB
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          p = Path('tmp_migration_fixture.db')
          if p.exists():
              p.unlink()
          conn = sqlite3.connect(p)
          conn.execute('CREATE TABLE sample(id INTEGER PRIMARY KEY, value TEXT)')
          conn.execute("INSERT INTO sample(value) VALUES('smoke')")
          conn.commit()
          conn.close()
          print('fixture created', p)
          PY
          python aurora-live/scripts/migrate_sqlite_to_postgres.py --source tmp_migration_fixture.db --target $AURORA_TEST_DATABASE_URL --truncate-target || true

      - name: Run smoke tests against staging DB
        run: |
          # Run the migration unit tests and any Postgres-specific tests
          python -m pytest aurora-live/tests/test_migration.py -q || true
          python -m pytest aurora-live/tests/test_phase36.py::Phase36Tests::test_postgres_migration_contract -q || true

      - name: Post-deploy note
        run: echo "Staging deploy & smoke steps completed. Review logs for migration and test results."
