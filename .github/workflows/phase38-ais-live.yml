name: AURORA Phase 38 AIS Live Qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/phase38-ais-live.yml'
      - 'aurora-live/phase38_*.py'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  ais-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AURORA_AISSTREAM_API_KEY: ${{ secrets.AURORA_AISSTREAM_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AIS runtime dependency
        run: python -m pip install 'websocket-client>=1.8,<2'
      - name: Verify secret is configured
        shell: bash
        run: |
          if [ -z "$AURORA_AISSTREAM_API_KEY" ]; then
            echo 'AURORA_AISSTREAM_API_KEY is not configured.' >&2
            exit 1
          fi
      - name: Capture and persist one live AIS observation
        working-directory: aurora-live
        run: |
          rm -f /tmp/aurora-ais-live.sqlite3
          python phase38_worker.py \
            --provider maritime \
            --database /tmp/aurora-ais-live.sqlite3 \
            --max-messages 5 \
            --timeout 45
      - name: Verify durable maritime evidence
        working-directory: aurora-live
        run: |
          python - <<'PY'
          from phase38_transport import TransportStore

          store = TransportStore('/tmp/aurora-ais-live.sqlite3')
          rows = store.observations(domain='maritime', provider='aisstream', limit=10)
          providers = store.providers(domain='maritime')
          assert rows, 'No AIS observation was durably persisted'
          assert any(row['provider'] == 'aisstream' and row['state'] == 'ONLINE' for row in providers), 'AIS provider was not marked online'
          print({'provider': 'aisstream', 'durable_observations': len(rows), 'qualified': True})
          PY
